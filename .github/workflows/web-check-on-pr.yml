name: Check Web on PR

on:
  pull_request:
    branches:
      - '**'
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-*.yml'
      - '.github/templates/setup-npm/**'
      - '.nvmrc'

permissions:
  contents: read

concurrency:
  group: web-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/templates/setup-npm
        with:
          directory: apps/web

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Build
        run: npm run build

      - name: Check the static export
        run: test -f out/index.html && test -f out/404.html
