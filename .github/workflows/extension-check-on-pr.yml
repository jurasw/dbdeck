name: Check Extension on PR

on:
  pull_request:
    paths: ['apps/extension/**', '.github/workflows/extension-*.yml', '.nvmrc']
  push:
    branches: [main]
    paths: ['apps/extension/**', '.github/workflows/extension-*.yml', '.nvmrc']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Lint and format check
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Package extension
        run: npm run package
      - name: Upload VSIX for review
        uses: actions/upload-artifact@v4
        with:
          name: dbdeck-vsix
          path: apps/extension/*.vsix
          if-no-files-found: error
