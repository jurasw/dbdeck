name: Check Extension on PR

on:
  pull_request:
    branches:
      - '**'
    paths:
      - 'apps/extension/**'
      - '.github/workflows/extension-*.yml'
      - '.github/templates/setup-npm/**'
      - '.nvmrc'
  push:
    branches:
      - main
    paths:
      - 'apps/extension/**'
      - '.github/workflows/extension-*.yml'
      - '.github/templates/setup-npm/**'
      - '.nvmrc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/templates/setup-npm
        with:
          directory: apps/extension

      - name: Type check
        run: npm run check

      - name: Lint and format check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package
        run: npm run package

      - name: Upload VSIX for review
        uses: actions/upload-artifact@v4
        with:
          name: dbdeck-vsix
          path: apps/extension/*.vsix
          if-no-files-found: error
