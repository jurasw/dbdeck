name: Package Extension

# Builds a VSIX for manual review. Publishing lives in extension-publish.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/templates/setup-npm
        with:
          directory: apps/extension

      - name: Validate
        run: npm run validate

      - name: Package
        run: npm run package

      - name: Upload VSIX for review
        uses: actions/upload-artifact@v4
        with:
          name: dbdeck-vsix
          path: apps/extension/*.vsix
          if-no-files-found: error
