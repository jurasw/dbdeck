name: Package Extension

# Preparation only: no Marketplace publishing or GitHub release creation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: npm run validate
      - name: Package extension
        run: npm run package
      - name: Upload VSIX for review
        uses: actions/upload-artifact@v4
        with:
          name: dbdeck-vsix
          path: '*.vsix'
          if-no-files-found: error
