name: Deploy dashboard (prod)

# A deployment is an explicit action. Shared extension edits only run the
# dashboard checks; they do not publish a website or change DNS automatically.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://dashboard.dbdeck.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup shared extension
        uses: ./.github/templates/setup-npm
        with:
          directory: apps/extension

      - name: Setup dashboard
        uses: ./.github/templates/setup-npm
        with:
          directory: apps/dashboard

      - name: Validate shared extension
        run: npm run validate
        working-directory: apps/extension

      - name: Check dashboard
        run: npm run check && npm run lint && npm test && npm run build && npm run smoke
        working-directory: apps/dashboard
        env:
          BROWSER_EXECUTABLE: /usr/bin/google-chrome

      - name: Deploy static assets
        run: npx wrangler deploy
        working-directory: apps/dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Check public dashboard
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors https://dashboard.dbdeck.dev/ --output /dev/null
