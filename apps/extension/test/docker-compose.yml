name: dbdeck-test

services:
  dynamodb:
    profiles: ['dynamodb']
    image: amazon/dynamodb-local:3.1.0
    command: ['-jar', 'DynamoDBLocal.jar', '-inMemory', '-sharedDb']
    ports: ['18000:8000']
  mssql:
    profiles: ['mssql']
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: dbdeckTest123!
    ports: ['11433:1433']
  cassandra:
    profiles: ['cassandra']
    image: cassandra:5.0
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    ports: ['19042:9042']
    healthcheck:
      test: ['CMD', 'cqlsh', '-e', 'SELECT release_version FROM system.local;']
      interval: 10s
      timeout: 10s
      retries: 60
  oracle:
    profiles: ['oracle']
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: dbdeckTest123
      APP_USER: dbdeck
      APP_USER_PASSWORD: dbdeckTest123
    ports: ['11521:1521']
    healthcheck:
      test: ['CMD', 'healthcheck.sh']
      interval: 10s
      timeout: 5s
      retries: 60
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: dbdeck
      POSTGRES_DB: shop
    ports: ['15433:5432']
  mysql:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: dbdeck
      MARIADB_DATABASE: shop
    ports: ['13306:3306']
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: dbdeck
    ports: ['27018:27017']
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--requirepass', 'dbdeck']
    ports: ['16379:6379']
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: dbdeck
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    ports: ['18123:8123']
  elasticsearch:
    image: elasticsearch:8.11.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms384m -Xmx384m
    ports: ['19200:9200']
  s3:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: dbdeck
      RUSTFS_SECRET_KEY: dbdeck123
    ports: ['19000:9000']
